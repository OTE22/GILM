[project]
name = "gilm"
version = "0.1.0"
description = "Provider-neutral, versioned LLM execution plans with a safe reporting adapter"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.15.1,<5",
    "fastapi>=0.142.2,<1",
    "httpx>=0.28.1,<1",
    "pydantic>=2.13.5,<3",
    "uvicorn[standard]>=0.54.0,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "trustme>=1.2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
